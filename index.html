<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stunden">

<title>Alma Stundenzettel</title>
<style>
:root{--navy:#031c48;--orange:#da5925;--ink:#0b1630;--muted:#5d6a84;--line:#dde3ee;--bg:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 24px;border-bottom:4px solid var(--orange)}
header small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
header h1{margin:6px 0 0;font:700 28px/1.1 Georgia,"Rockwell",serif;letter-spacing:.02em;text-transform:uppercase}
main{flex:1;padding:24px 20px;max-width:420px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:17px;background:#eef2f8}
input[type=password]:focus{outline:2px solid var(--orange);outline-offset:1px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;accent-color:var(--orange)}
button{border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--orange);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.4em;font-size:14px;color:#b42318}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><small>Alma Sports Club</small><h1>Stundenzettel</h1></header>
<main>
  <form id="f" style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" required autofocus>
    </div>
    <label class="check"><input type="checkbox" id="keep" checked> Auf diesem Gerät merken</label>
    <button type="submit" id="go">Öffnen</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <p class="hint">Das Passwort bekommst du vom Team.</p>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_NAME = "alma.key." + P.s.slice(0, 12);

const decrypt = async key => new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.d)));
const show = html => { document.open(); document.write(html); document.close(); };
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
// Gemerkter Schlüssel: direkt öffnen
(async () => {
  let saved = null; try{ saved = localStorage.getItem(KEY_NAME); }catch{}
  if(!saved) return;
  try{ show(await decrypt(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]))); }
  catch{ try{ localStorage.removeItem(KEY_NAME); }catch{} }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Wird geöffnet …"; msg.textContent = "";
  try{
    const key = await derive(document.getElementById("pw").value);
    const html = await decrypt(key);   // schlägt bei falschem Passwort fehl
    if(document.getElementById("keep").checked){
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try{ localStorage.setItem(KEY_NAME, btoa(String.fromCharCode(...raw))); }catch{}
    }
    show(html);
  }catch{
    msg.textContent = "Das Passwort stimmt nicht.";
    btn.disabled = false; btn.textContent = "Öffnen";
  }
});
</script>
